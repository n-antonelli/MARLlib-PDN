# MAPPO parameters

# Detailed explanation for each hyper parameter can be found in ray/rllib/agents/ppo/ippo.py

algo_args:
  # GAE
  use_gae: True
  lambda: 0.95
  # Entrenamiento
  lr: 0.00005  # 0.0001
  lr_schedule: [
      [0, 0.00005],         # inicio
      [150000, 0.00007],    # mitad del entrenamiento - 312,5 episodios
      [1500000, 0.00001],   # final - 3.125 episodios
  ]
  gamma: 0.995  # 0.98
  num_sgd_iter: 5  # 10
  batch_mode: 'complete_episodes'
  batch_episode: 20  # 10
  # PPO clip
  clip_param: 0.15  # 0.2
  kl_coeff: 0.05  # 0.1  # 0.2
  kl_target: 0.02
  # Crítico
  vf_clip_param: 1000.0  # 20.0  # 50.
  vf_loss_coeff: 0.5  # 0.1 # valor menor a 1 le da más importancia al actor (política)->el crítico es el que tiene más peso en el loss total}
  # Gradientes
  grad_clip: 0.5
  # Exploración
  entropy_coeff: 0.01  # 0.01
  "entropy_coeff_schedule": [
    [ 0, 0.01 ],  # entropía alta(mucha exploración)
    [ 576000 * 0.5, 0.001 ],  # A la mitad, bajamos bastante - 600 episodios
    [ 576000, 0.00001 ],  # Al final, casi cero(pura explotación) - 1.200 episodios
  ]
  # PDN
#  kl_coeff: 0.2
#  num_sgd_iter: 5
#  vf_loss_coeff: 0.5
#  entropy_coeff: 0.01
#  vf_clip_param: 10.0
#  batch_mode: "truncate_episodes"
  # PGW
